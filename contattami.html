<section class="class="contact-form">
    <h1>Contattami</h1>
    <p>Compila il modulo sottostante per inviare una richiesta di contatto. Ti risponderò al più presto!</p>    
<form action="mailto:silvia.hu@example.com" method="post" enctype="text/plain">
    <label for="name">Nome:</label><br>
    <input type="text" id="name" name="name" required><br><br>
    <label for="surname">Cognome:</label><br>
    <input type="text" id="surname" name="surname" required><br><br>
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>
    <label for="phone">Telefono:</label><br>
    <input type="tel" id="phone" name="phone"><br><br>
    <label for="subject">Oggetto:</label><br>
    <input type="text" id="subject" name="subject" required><br><br>
    <label for="message">Messaggio:</label><br>
    <textarea id="message" name="message" rows="5" required></textarea><br><br>
    <input type="submit" value="Invia richiesta">
</form>
</section>
