<section class="contact-form">
    <h1>Contattami</h1>
    <p>Compila il modulo sottostante per inviare una richiesta di contatto. Ti risponderò al più presto!</p>    
<form action="mailto:silvia.hu@example.com" method="post" enctype="text/plain">
    <div class="mb-3">
    <label for="name" class="form-label">Nome:</label>
    <input type="text" id="name" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
    <label for="email" class="form-label">Email:</label>
    <input type="email" id="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
    <label for="phone" class="form-label">Telefono:</label>
    <input type="tel" id="phone" name="phone" class="form-control">
    </div>
    <div class="mb-3">
    <label for="subject" class="form-label">Oggetto:</label>
    <input type="text" id="subject" name="subject" class="form-control" required>
    </div>
    <div class="mb-3">
    <label for="message" class="form-label">Messaggio:</label>
    <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
    </div>
    <input type="submit" value="Invia richiesta" class="btn btn-primary">
</form>
</section>
